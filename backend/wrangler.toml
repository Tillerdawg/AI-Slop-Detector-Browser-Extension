# Scaffold for the future community-ratings backend (see backend/README.md).
# Not deployed by this repo -- fill in your own account details and run
# `wrangler deploy` yourself when/if you decide to turn this on.

name = "ai-slop-detector-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ai-slop-detector"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Cloudflare's free tier (as of writing): 100k requests/day on Workers,
# 5GB storage + 5M rows read/day on D1 -- comfortably enough for this.
